services:
  db:
    image: postgres:16
    container_name: springshop-db
    environment:
      POSTGRES_DB: springshopdb
      POSTGRES_USER: springshop
      POSTGRES_PASSWORD: springshop
    ports:
      - "5432:5432"
    volumes:
      - springshop_data:/var/lib/postgresql/data

volumes:
  springshop_data:
