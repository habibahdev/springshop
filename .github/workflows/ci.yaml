name: CI - SpringShop

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Test backend Spring Boot
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: springshopdb
          POSTGRES_USER: springshop
          POSTGRES_PASSWORD: springshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U springshop -d springshopdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Configurer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: pom.xml

      - name: Rendre Maven Wrapper exécutable
        run: chmod +x mvnw

      - name: Compiler et exécuter les tests
        run: ./mvnw -B verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/springshopdb
          SPRING_DATASOURCE_USERNAME: springshop
          SPRING_DATASOURCE_PASSWORD: springshop

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore